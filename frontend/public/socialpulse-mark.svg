<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-labelledby="title desc">
  <title id="title">SocialPulse</title>
  <desc id="desc">SocialPulse orbit and conversation mark</desc>
  <defs>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF5A36"/><stop offset=".52" stop-color="#FFB020"/><stop offset="1" stop-color="#14E3A4"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="720" height="200" rx="44" fill="#0A100D"/>
  <g transform="translate(30 20)" filter="url(#glow)">
    <path d="M80 12c39 0 70 31 70 70s-31 70-70 70S10 121 10 82 41 12 80 12Z" fill="none" stroke="url(#pulse)" stroke-width="9" stroke-dasharray="278 55" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 80 82" to="360 80 82" dur="9s" repeatCount="indefinite"/></path>
    <path d="M40 91c12-18 23 18 35 0s23-18 35 0 23 18 35 0" fill="none" stroke="#F6F2EA" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><animate attributeName="stroke-dashoffset" values="0;80;0" dur="2.8s" repeatCount="indefinite"/></path>
    <circle cx="32" cy="39" r="7" fill="#14E3A4"/><circle cx="129" cy="133" r="7" fill="#FF5A36"/>
  </g>
  <text x="205" y="125" fill="#F6F2EA" font-family="Arial,sans-serif" font-size="64" font-weight="800" letter-spacing="-2">SocialPulse</text>
</svg>
